# ============================================================
# CareerAI 业务 CI：后端（pytest + ruff）+ 前端（lint/typecheck/test/build）
# 本文件已按公开仓库根目录结构适配（backend/ 与 frontend/ 位于仓库根）
# ============================================================
name: business-ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: business-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端（pytest + ruff）
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: 安装后端依赖
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: 单元测试（pytest，mock 隔离无需 API Key）
        working-directory: backend
        run: python -m pytest

      - name: 静态检查（ruff）
        working-directory: backend
        run: ruff check .

  frontend:
    name: 前端（lint + typecheck + test + build）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖（npm ci）
        working-directory: frontend
        run: npm ci

      - name: 代码检查（eslint）
        working-directory: frontend
        run: npm run lint

      - name: 类型检查（tsc）
        working-directory: frontend
        run: npm run typecheck

      - name: 单元测试（vitest）
        working-directory: frontend
        run: npm run test

      - name: 生产构建（vite build）
        working-directory: frontend
        run: npm run build
