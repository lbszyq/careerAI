# CareerAI 前端 Nginx 配置（容器内，nginx:1.27-alpine）
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # index.html 不缓存：避免发版后浏览器继续使用旧资源清单（旧 hash 资源 404 -> MIME 错）
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 带 hash 的静态资源长缓存；缺失时返回 404，不落到 SPA 回退（避免 text/html 冒充 JS）
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA 路由回退（react-router）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理到 backend 服务（保持 /api 前缀，与 vite dev proxy 行为一致）
    location /api/ {
        # 简历上传上限对齐前端 10MB（nginx 默认 1MB 会误拦 >1MB 请求）
        client_max_body_size 10m;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 报告生成/异步任务等长请求（AI_WATCHDOG_SECONDS 上限 300s）
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
